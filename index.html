<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Anonymous ($AIAA) - Gamblers Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neon-blue': '#00f3ff',
              'neon-pink': '#ff00ff',
              'neon-green': '#39ff14',
              'cyber-black': '#050505',
              'cyber-gray': '#121212',
              'cyber-dark': '#0a0a0a',
            },
            fontFamily: {
              serif: ['Times New Roman', 'Times', 'serif'],
              sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            boxShadow: {
              'neon-blue': '0 0 5px #00f3ff, 0 0 10px #00f3ff',
              'neon-pink': '0 0 5px #ff00ff, 0 0 10px #ff00ff',
              'neon-green': '0 0 5px #39ff14, 0 0 10px #39ff14',
              'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 5px #00f3ff, 0 0 10px #00f3ff' },
                '100%': { boxShadow: '0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 30px #00f3ff' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --mouse-x: 50%;
        --mouse-y: 50%;
      }

      body {
        background-color: #050505;
        color: #e0e0e0;
        overflow-x: hidden;
        /* Cyber Grid Background */
        background-image: 
          linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
        background-size: 30px 30px;
        position: relative;
      }

      /* Flashlight Effect */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          600px circle at var(--mouse-x) var(--mouse-y), 
          rgba(0, 243, 255, 0.04), 
          transparent 40%
        );
        pointer-events: none;
        z-index: 0;
      }
      
      /* CRT Overlay */
      .crt-overlay {
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.25) 50%
        ), linear-gradient(
          90deg, 
          rgba(255, 0, 0, 0.06), 
          rgba(0, 255, 0, 0.02), 
          rgba(0, 0, 255, 0.06)
        );
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
      
      .crt-flicker {
        animation: flicker 0.15s infinite;
        opacity: 0.1; /* Base opacity */
      }

      @keyframes flicker {
        0% { opacity: 0.1; }
        50% { opacity: 0.15; }
        100% { opacity: 0.1; }
      }
      
      .font-serif-headline {
        font-family: "Times New Roman", Times, serif;
        letter-spacing: -0.04em;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505; 
        border-left: 1px solid #111;
      }
      ::-webkit-scrollbar-thumb {
        background: #39ff14; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff; 
      }
      
      .cyber-texture {
        background-color: #0a0a0a;
        background-image: radial-gradient(#111 15%, transparent 16%), radial-gradient(#111 15%, transparent 16%);
        background-size: 4px 4px;
      }

      .text-glow-blue {
        text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
      }
      .text-glow-pink {
        text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
      }
      .text-glow-green {
        text-shadow: 0 0 5px #39ff14, 0 0 10px #39ff14;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
